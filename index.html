<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FFXIV DAT Manager</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/renderer/main.tsx"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas-pro/dist/html2canvas-pro.min.js"></script>
    <script>
      function captureElement(e) {
        setTimeout(() => {
          html2canvas(e).then((c) => {
            c.toBlob((b) => {
              navigator.clipboard.write([
                new ClipboardItem({
                  'image/png': b,
                }),
              ]);
            }, 'image/png');
          });
          console.log('done!');
        }, 2000);
      }
    </script>
  </body>
</html>
